; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
default_envs = pico ; По умолчанию выбрана твоя Raspberry Pi Pico

; ==========================================
; ОБЩИЕ БИБЛИОТЕКИ ДЛЯ ВСЕХ МИКРОКОНТРОЛЛЕРОВ
; ==========================================
[env]
framework = arduino
monitor_speed = 115200
monitor_filters = direct ; <-- ДОБАВЬТЕ ЭТУ СТРОКУ

lib_deps = 
    ; --- Датчики из твоих прошлых тестов ---
    adafruit/Adafruit AS7341@^1.4.1
    ;oxullo/MAX30100lib@^1.2.1
    ;sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
    
    ; --- Климат, Давление и Свет ---
    ;adafruit/DHT sensor library@^1.4.6
    ;adafruit/Adafruit Unified Sensor@^1.1.14
    ;adafruit/Adafruit BMP280 Library@^2.6.8
    ;adafruit/Adafruit VEML7700 Library@^2.1.6
    
    ; --- Дисплеи ---
    ;adafruit/Adafruit SSD1306@^2.5.13
    ;adafruit/Adafruit GFX Library@^1.11.11
    ;marcoschwartz/LiquidCrystal_I2C@^1.1.2
    
    ; --- Движения и Часы ---
    ;rfetick/MPU6050_light@^1.1.0
    ;makuna/RTC@^2.4.3
    
    ; --- Радио, RFID и Картридеры ---
    ;miguelbalboa/MFRC522@^1.4.11
    ;256dpi/MQTT@^2.5.2
    ;greiman/SdFat@^2.3.0
    
    ; --- Серво и ШИМ ---
    ;arduino-libraries/Servo@^1.2.2

; ==========================================
; 1. Raspberry Pi Pico (RP2040)
; ==========================================
[env:pico]
platform = raspberrypi
board = pico

; ==========================================
; 2. RP2040-Zero
; ==========================================
[env:pico_zero]
platform = raspberrypi
board = waveshare_rp2040_zero

; ==========================================
; 3. ESP32-WROOM-32 (38 pin)
; ==========================================
[env:esp32_wroom]
platform = espressif32
board = esp32dev

; ==========================================
; 4. ESP32-C3 SuperMini
; ==========================================
[env:esp32_c3_supermini]
platform = espressif32
board = esp32-c3-devkitm-1

; ==========================================
; 5. Arduino Uno R3
; ==========================================
[env:uno]
platform = atmelavr
board = uno